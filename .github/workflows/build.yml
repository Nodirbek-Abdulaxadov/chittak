name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Analyze & Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Chittak.slnx

      - name: Build
        run: dotnet build Chittak.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test --no-build --configuration Release

  docker:
    name: Docker Image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build image
        run: docker build -f src/Server/Dockerfile -t chittak:ci .
